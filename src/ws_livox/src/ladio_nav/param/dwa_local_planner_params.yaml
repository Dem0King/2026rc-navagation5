DWAPlannerROS:
# =============================================================================
# 1. 机器人运动学参数 (差速模式约束)
# =============================================================================

  max_vel_trans: 0.3           # 最大平移速度，与 max_vel_x 保持一致
  min_vel_trans: -0.2          # 最小平移速度，防止终点微调时卡死不走

  max_vel_x: 0.3 # 1.0              # 最大线速度 x (m/s) 0.7 → 降速防终点过冲
  min_vel_x: -0.2 # -1.0             # 最小线速度 x (m/s) -0.55 → 微调不倒车过猛

  max_vel_y: 0.0 # 1.0 0.4              # 最大线速度 y (m/s，全向轮/麦克纳姆轮有效)
  min_vel_y: 0.0 # -1.0 -0.35           # 最小线速度 y (m/s)

  max_vel_theta: 1.5         # 最大角速度 (rad/s) 1.5 → 降速防终点过冲
  min_vel_theta: -1.5  # -1.0         # 最小角速度 (rad/s)
  
  acc_lim_x: 1.5             # x 方向最大加速度 (m/s²) 5.0 → 平缓减速防过冲
  acc_lim_y: 0.0             # y 方向最大加速度 (m/s²) 10.0 
  acc_lim_theta: 0.5          # 1.0 → 平缓角减速防过冲

# =============================================================================
# 2. 目标容差与精停控制 (解决终点来回挪动)
# =============================================================================
  xy_goal_tolerance: 0.10      # 目标位置容差 (m)，5cm 圈，四足底盘的最佳平衡点
  yaw_goal_tolerance: 0.10     # 目标角度容差 (rad)，约 6° 容差
  
  # 【绝对核心】一旦进入 5cm 容差圈，锁死位置，此后只原地旋转对齐朝向，绝对不准再前后腾挪
  latch_xy_goal_tolerance: true

# =============================================================================
# 3. 前向轨迹仿真参数 (影响原地旋转的计算成功率)
# =============================================================================
  sim_time: 1.5                # 前向模拟时间 (s)，太短会导致原地旋转时判为非法轨迹
  sim_granularity: 0.025       # 步长粒度 (m)
  
  vx_samples: 10               # 线速度空间采样点数
  vy_samples: 1                # Y轴线速度不采样（因为本来就是0），极大地节省 CPU 算力
  vth_samples: 30              # 【关键】角速度采样点数必须拉高！
                               # DWA 是靠离散采样打分的，如果旋转采样太稀疏，原地转圈时会选不出纯旋转指令

# =============================================================================
# 4. 轨迹评价权重 (让算法变成纯粹的循迹工具)
# =============================================================================
  path_distance_bias: 45.0     # 【拉高】底盘贴合全局路径（红线）的权重，越大越走直线
  goal_distance_bias: 24.0     # 前往目标点的权重
  occdist_scale: 0.0           # 【关键】局部避障和地图障碍物占用的打分权重。
                               # 设为 0.0 意味着彻底关闭局部避障，不再理会雷达扫到的障碍物，算力消耗暴降

  stop_time_buffer: 0.2        # 刹车预留时间
  oscillation_reset_dist: 0.10 # 判定脱离震荡的距离，与目标容差对齐

# =============================================================================
# 5. 机器人轮廓模型
# =============================================================================
  # 与你的代价地图保持一致
  footprint: [[0.35, 0.25], [0.35, -0.25], [-0.35, -0.25], [-0.35, 0.25]]